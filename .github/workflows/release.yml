name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without a leading v (for example: 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build DMG and publish release
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version="${{ inputs.version }}"
            version="${version#v}"
            tag="v${version}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be X.Y.Z or vX.Y.Z, got: $version" >&2
            exit 1
          fi

          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" != "$file_version" ]]; then
            echo "Release version $version differs from VERSION ($file_version)" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute build number
        id: build
        run: echo "number=$(bash Scripts/build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Install dmgbuild
        run: pipx install dmgbuild

      - name: Build DMG
        run: |
          MARKETING_VERSION="${{ steps.version.outputs.version }}" \
          BUILD_VERSION="${{ steps.build.outputs.number }}" \
          make dmg

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail

          app="dist/AgentMeter.app"
          dmg="dist/AgentMeter-${{ steps.version.outputs.version }}.dmg"

          test -x "$app/Contents/MacOS/AgentMeter"
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          test -d "$app/Contents/Resources/AgentMeter_AgentMeter.bundle"
          test -f "$app/Contents/Resources/embedded-pricing.json"
          test -f "$app/Contents/Resources/AppIcon.icns"
          test -f "$dmg"

          short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          build_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          if [[ "$short_version" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Unexpected CFBundleShortVersionString: $short_version" >&2
            exit 1
          fi
          if [[ "$build_version" != "${{ steps.build.outputs.number }}" ]]; then
            echo "Unexpected CFBundleVersion: $build_version" >&2
            exit 1
          fi
          if [[ ! "$build_version" =~ ^[0-9]{12}$ ]]; then
            echo "CFBundleVersion must be 12 digits (YYYYMMDDHHMM), got: $build_version" >&2
            exit 1
          fi
          # A release build updates itself: no rc channel key, a feed URL.
          if /usr/libexec/PlistBuddy -c 'Print :AgentMeterUpdateChannel' "$app/Contents/Info.plist" >/dev/null 2>&1; then
            echo "The release app carries AgentMeterUpdateChannel; it must be a release-channel build" >&2
            exit 1
          fi
          feed_url="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app/Contents/Info.plist" 2>/dev/null || true)"
          if [[ "$feed_url" != https://* ]]; then
            echo "The release app has no https SUFeedURL: '$feed_url'" >&2
            exit 1
          fi

          # Sparkle only offers an update whose build number is greater than the
          # installed one, so it must exceed what the published feed already has.
          appcast="$(mktemp)"
          status="$(curl -sSL --retry 3 --retry-delay 2 -o "$appcast" -w '%{http_code}' \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml")"
          case "$status" in
            200)
              published="$(grep -oE '(<sparkle:version>|sparkle:version=")[0-9]+' "$appcast" \
                | grep -oE '[0-9]+$' | sort -n | tail -n 1 || true)"
              if [[ -z "$published" ]]; then
                echo "::notice::The published appcast has no sparkle:version; skipping the build number comparison."
              elif (( 10#$build_version <= 10#$published )); then
                echo "CFBundleVersion $build_version is not greater than the published sparkle:version $published" >&2
                exit 1
              else
                echo "CFBundleVersion $build_version > published sparkle:version $published"
              fi
              ;;
            404)
              echo "::notice::No published appcast found; skipping the build number comparison."
              ;;
            *)
              echo "Could not fetch the published appcast (HTTP $status)" >&2
              exit 1
              ;;
          esac

          codesign --verify --deep --strict "$app"
          hdiutil imageinfo "$dmg" >/dev/null
          shasum -a 256 "$dmg" | tee dist/SHA256SUMS

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is not configured; skipping appcast generation."
            exit 0
          fi

          SPARKLE_VERSION="${{ steps.version.outputs.version }}" \
          SPARKLE_DOWNLOAD_URL_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/" \
          make appcast

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentMeter-${{ steps.version.outputs.version }}
          path: |
            dist/AgentMeter-${{ steps.version.outputs.version }}.dmg
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        shell: bash
        run: |
          set -euo pipefail

          dmg="dist/AgentMeter-${VERSION}.dmg"
          assets=("$dmg" dist/SHA256SUMS)
          if [[ -f dist/appcast.xml ]]; then
            assets+=(dist/appcast.xml)
          fi

          {
            echo "Automated AgentMeter build for ${TAG}."
            echo
            echo "SHA-256:"
            sed 's/^/- /' dist/SHA256SUMS
          } > release-notes.md

          flags=(--title "AgentMeter ${VERSION}" --notes-file release-notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" "${flags[@]}"
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              "${flags[@]}"
          fi
